<title>Stickers de Lázaro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: encabezado corto + lista de cortes en video 16:9 con audio original */
:root{
  --bg:#f6f3ee; --surface:#ffffff; --fg:#2a241d; --muted:#7a6f62; --line:#e4ddd2; --accent:#9a5b2c;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17140f; --surface:#221e18; --fg:#f1ebe2; --muted:#a89c8c; --line:#3a332a; --accent:#e0a36f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f; --surface:#221e18; --fg:#f1ebe2; --muted:#a89c8c; --line:#3a332a; --accent:#e0a36f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.8rem,5vw,2.6rem);margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
video{width:100%;max-width:100%;aspect-ratio:4/3;display:block;background:#000}
figcaption{padding:10px 14px 12px;display:flex;gap:10px;align-items:baseline}
.n{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:.85rem}
.t{font-weight:500;min-width:0}
.time{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>

<div class="wrap">
  <h1>Stickers de Lázaro</h1>
  <p class="lede">5 cortes del video original, con su imagen y su audio tal cual. Cada corte termina justo después de que suena «LOVE ME», y el encuadre deja fuera la marca de TikTok. Toca ▶ para verlo con sonido.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
const S=[
 ["corte_01","«¡Lázaro, levántate!»","0:00 – 0:09"],
 ["corte_02","Marta: «Señor, si hubieras estado aquí…»","0:09 – 0:27"],
 ["corte_03","«Tu hermano resucitará»","0:27 – 0:45"],
 ["corte_04","«Yo soy la resurrección y la vida»","0:45 – 1:00"],
 ["corte_05","Lázaro sale de la tumba","1:00 – 1:19"]];
const grid=document.getElementById('grid');
S.forEach(([f,t,tm],i)=>{
  const fig=document.createElement('figure');
  const v=document.createElement('video');
  v.src='cortes/'+f+'.mp4?v=3';v.controls=true;v.playsInline=true;v.preload='metadata';v.setAttribute('aria-label',t);
  v.addEventListener('play',()=>document.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()}));
  const c=document.createElement('figcaption');
  c.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t"></span><span class="time">'+tm+'</span>';
  c.querySelector('.t').textContent=t;
  fig.append(v,c);grid.appendChild(fig);
});
</script>
